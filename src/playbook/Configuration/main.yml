---
# ANCX777 Playbook - performance and privacy
# Entry file for AME Wizard. Actions run elevated (SYSTEM / TrustedInstaller) unless a
# different context is requested with `runas:`. Anything tagged with `option:` only runs
# when the matching choice in the playbook's Feature Pages is selected.
actions:
  # ===========================================================================
  #  INIT
  # ===========================================================================
  - !writeStatus: {status: 'Initializing'}
  - !cmd: {command: 'if not exist "%ProgramData%\ANCX777\Logs" mkdir "%ProgramData%\ANCX777\Logs"', wait: true, errorAction: Ignore}
  - !writeStatus: {status: 'Closing conflicting system processes'}
  - !taskKill: {name: 'explorer', errorAction: Ignore}
  - !taskKill: {name: 'ShellExperienceHost', errorAction: Ignore}
  - !taskKill: {name: 'StartMenuExperienceHost', errorAction: Ignore}
  - !taskKill: {name: 'SearchApp', errorAction: Ignore}
  - !taskKill: {name: 'SearchHost', errorAction: Ignore}
  - !taskKill: {name: 'SearchUI', errorAction: Ignore}
  - !taskKill: {name: 'RuntimeBroker', errorAction: Ignore}
  - !taskKill: {name: 'TextInputHost', errorAction: Ignore}
  - !taskKill: {name: 'backgroundTaskHost', errorAction: Ignore}
  - !taskKill: {name: 'Widgets', errorAction: Ignore}

  # ===========================================================================
  #  POWER
  # ===========================================================================
  - !writeStatus: {status: 'Applying Power Settings'}
  - !powerShell:
      wait: true
      errorAction: Ignore
      command: >-
        powercfg /x monitor-timeout-ac 0;
        powercfg /x disk-timeout-ac 0;
        powercfg /x standby-timeout-ac 0;
        powercfg /x hibernate-timeout-ac 0;
        powercfg /x monitor-timeout-dc 0;
        powercfg /x disk-timeout-dc 0;
        powercfg /x standby-timeout-dc 0;
        powercfg /x hibernate-timeout-dc 0;
  - !cmd: {command: 'powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61', wait: true, errorAction: Ignore}
  - !cmd: {command: 'powercfg -setactive e9a42b02-d5df-448d-aa00-03f14749eb61', wait: true, errorAction: Ignore}
  - !powerShell:
      wait: true
      errorAction: Ignore
      command: >-
        powercfg /setacvalueindex scheme_current sub_processor PERFINCPOL 2;
        powercfg /setacvalueindex scheme_current sub_processor PERFDECPOL 1;
        powercfg /setacvalueindex scheme_current sub_processor PROCTHROTTLEMIN 100;
        powercfg /setactive scheme_current;
  - !cmd: {command: 'bcdedit /set useplatformclock false', wait: true, errorAction: Ignore}
  - !cmd: {command: 'bcdedit /set disabledynamictick yes', wait: true, errorAction: Ignore}

  # ===========================================================================
  #  BRANDING / WALLPAPER
  # ===========================================================================
  - !writeStatus: {status: 'Applying ANCX777 Branding'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'Manufacturer', type: REG_SZ, data: 'ANCX777'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'Model', type: REG_SZ, data: 'ANCX777'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'SupportURL', type: REG_SZ, data: 'ANCX777'}

  - !cmd: {exeDir: true, command: 'xcopy "Windows" "%windir%" /E /I /Y', runas: trustedInstaller, wait: true, errorAction: Ignore}
  - !powerShell: {command: '.\SetWallpaper.ps1 -Mode Desktop -ImagePath $env:systemroot\Web\Wallpaper\ANCX777\img0.jpg', exeDir: true, wait: true, runas: currentUserElevated, errorAction: Ignore, option: 'change-wallpaper'}
  - !powerShell: {command: '.\SetWallpaper.ps1 -Mode LockScreen -ImagePath $env:systemroot\Web\Wallpaper\ANCX777\img0.jpg', exeDir: true, wait: true, runas: currentUserElevated, errorAction: Ignore, option: 'change-wallpaper'}
  # 'keep-wallpaper' is intentionally a no-op - keeping the current wallpaper means changing nothing.
  # winver prints RegisteredOwner first, then RegisteredOrganization on the next line,
  # so this value is what shows up under "Windows User".
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion', value: 'RegisteredOrganization', type: REG_SZ, data: 'ACNX+ Optimize', option: 'add-branding'}
  # 'keep-branding' is intentionally a no-op - it leaves the registered organization as it is.

  # ===========================================================================
  #  VISUALS
  # ===========================================================================
  - !writeStatus: {status: 'Applying Visual Settings'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'ShowTaskViewButton', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'TaskbarMn', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Hidden', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'HideFileExt', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Search', value: 'SearchboxTaskbarMode', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'SystemUsesLightTheme', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'AppsUseLightTheme', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'EnableTransparency', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer', value: 'ShowRecommendations', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'TaskbarDa', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'ShowCopilotButton', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'TaskbarSmallIcons', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_Layout', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Shell Extensions\Blocked', value: '{e2bf9676-5f8f-435c-97eb-11607a5bedf7}', type: REG_SZ, data: ''}
  - !registryValue: {path: 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Shell Extensions\Blocked', value: '{e2bf9676-5f8f-435c-97eb-11607a5bedf7}', type: REG_SZ, data: ''}
  - !taskKill: {name: 'explorer', errorAction: Ignore}
  - !run: {exe: 'explorer.exe', runas: 'currentUser', wait: false, errorAction: Ignore}

  # ===========================================================================
  #  ONEDRIVE
  # ===========================================================================
  - !writeStatus: {status: 'Removing OneDrive', option: 'remove-onedrive'}
  - !powerShell:
      wait: true
      runas: currentUserElevated
      option: 'remove-onedrive'
      errorAction: Ignore
      command: >-
        Get-Process -Name 'OneDrive' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
        Get-AppxPackage -Name '*OneDrive*' -AllUsers -ErrorAction SilentlyContinue | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue;
        Get-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like '*OneDrive*' } | Remove-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue;
        Get-ChildItem (Join-Path $env:SystemDrive 'Users\*\AppData\Local\Microsoft\OneDrive') -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
  - !registryValue: {path: 'HKLM\SOFTWARE\Classes\CLSID\{018D5C66-4533-4307-9B53-224DE2ED1FE6}', value: 'System.IsPinnedToNameSpaceTree', type: REG_DWORD, data: '0', option: 'remove-onedrive'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Classes\WOW6432Node\CLSID\{018D5C66-4533-4307-9B53-224DE2ED1FE6}', value: 'System.IsPinnedToNameSpaceTree', type: REG_DWORD, data: '0', option: 'remove-onedrive'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{018D5C66-4533-4307-9B53-224DE2ED1FE6}', operation: delete, option: 'remove-onedrive'}
  - !registryKey: {path: 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace\{018D5C66-4533-4307-9B53-224DE2ED1FE6}', operation: delete, option: 'remove-onedrive'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\OneDrive', value: 'DisableFileSyncNGSC', type: REG_DWORD, data: '1', option: 'remove-onedrive'}
  - !powerShell:
      wait: true
      option: 'remove-onedrive'
      errorAction: Ignore
      command: >-
        $bases = @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace');
        Get-ChildItem 'Registry::HKEY_USERS' -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -match '^S-1-5-21-' } | ForEach-Object { $bases += ('Registry::' + $_.Name + '\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Desktop\NameSpace') };
        foreach ($b in $bases) { if (Test-Path $b) { Get-ChildItem $b -ErrorAction SilentlyContinue | ForEach-Object { $d = (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).'(default)'; if ($d -like '*OneDrive*') { Remove-Item $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue } } } }

  # ===========================================================================
  #  DEFENDER
  # ===========================================================================
  - !writeStatus: {status: 'Disabling Defender', option: 'disable-defender'}
  - !cmd: {command: 'reg.exe add "HKLM\SOFTWARE\Microsoft\Windows Defender\Features" /v TamperProtection /t REG_DWORD /d 0 /f', runas: trustedInstaller, wait: true, errorAction: Ignore, option: 'disable-defender'}
  - !writeStatus: {status: 'Disabling Defender: Services', option: 'disable-defender'}
  - !service: {name: 'WinDefend', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'WdFilter', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'WdNisDrv', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'WdNisSvc', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'WdBoot', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'MDCoreSvc', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'Sense', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'SecurityHealthService', operation: change, startup: 4, option: 'disable-defender'}
  - !service: {name: 'wscsvc', operation: change, startup: 4, option: 'disable-defender'}
  - !writeStatus: {status: 'Disabling Defender: Policies', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender', value: 'DisableAntiSpyware', type: REG_DWORD, data: '1', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender', value: 'DisableAntiVirus', type: REG_DWORD, data: '1', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection', value: 'DisableRealtimeMonitoring', type: REG_DWORD, data: '1', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet', value: 'SpynetReporting', type: REG_DWORD, data: '0', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Spynet', value: 'SpyNetReporting', type: REG_DWORD, data: '0', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Spynet', value: 'DisableBlockAtFirstSeen', type: REG_DWORD, data: '1', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection', value: 'DisableBehaviorMonitoring', type: REG_DWORD, data: '1', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection', value: 'DisableOnAccessProtection', type: REG_DWORD, data: '1', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection', value: 'DisableScanOnRealtimeEnable', type: REG_DWORD, data: '1', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\SmartScreen', value: 'ConfigureAppInstallControlEnabled', type: REG_DWORD, data: '0', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\SmartScreen', value: 'ConfigureAppInstallControl', type: REG_SZ, data: 'Anywhere', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer', value: 'SmartScreenEnabled', type: REG_SZ, data: 'Off', option: 'disable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\smartscreen.exe', value: 'Debugger', type: REG_SZ, data: '%SYSTEMROOT%\System32\taskkill.exe', option: 'disable-defender'}
  - !service: {name: 'smartscreen', operation: change, startup: 4, option: 'disable-defender'}
  # Undo path, so re-running with "Keep Defender" brings Windows Security back.
  - !writeStatus: {status: 'Enabling Defender', option: 'enable-defender'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender', operation: delete, option: 'enable-defender'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\smartscreen.exe', operation: delete, option: 'enable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer', value: 'SmartScreenEnabled', type: REG_SZ, data: 'Warn', option: 'enable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Features', value: 'TamperProtection', type: REG_DWORD, data: '5', option: 'enable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection', value: 'DisableBehaviorMonitoring', type: REG_DWORD, data: '0', option: 'enable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection', value: 'DisableOnAccessProtection', type: REG_DWORD, data: '0', option: 'enable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection', value: 'DisableScanOnRealtimeEnable', type: REG_DWORD, data: '0', option: 'enable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Spynet', value: 'SpyNetReporting', type: REG_DWORD, data: '2', option: 'enable-defender'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Spynet', value: 'DisableBlockAtFirstSeen', type: REG_DWORD, data: '0', option: 'enable-defender'}
  # sc.exe is used for these because boot and system starts cannot be expressed with a plain startup value.
  - !powerShell:
      wait: true
      runas: trustedInstaller
      errorAction: Ignore
      option: 'enable-defender'
      command: >-
        $startup = @{ WinDefend = 'auto'; WdFilter = 'system'; WdNisDrv = 'system'; WdNisSvc = 'demand'; WdBoot = 'boot';
                      MDCoreSvc = 'demand'; Sense = 'demand'; SecurityHealthService = 'demand'; wscsvc = 'auto'; smartscreen = 'auto' };
        foreach ($name in $startup.Keys) { & sc.exe config $name 'start=' $startup[$name] 2>$null | Out-Null }
  - !powerShell:
      wait: true
      runas: trustedInstaller
      errorAction: Ignore
      option: 'enable-defender'
      command: >-
        Start-Service -Name 'WinDefend' -ErrorAction SilentlyContinue;
        Set-MpPreference -DisableRealtimeMonitoring $false -DisableBehaviorMonitoring $false -DisableBlockAtFirstSeen $false -DisableIOAVProtection $false -DisableScriptScanning $false -MAPSReporting Advanced -SubmitSamplesConsent SendSafeSamples -ErrorAction SilentlyContinue

  # ===========================================================================
  #  UAC
  # ===========================================================================
  - !writeStatus: {status: 'Configuring UAC', option: 'enable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'EnableLUA', type: REG_DWORD, data: '1', option: 'enable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin', type: REG_DWORD, data: '5', option: 'enable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'PromptOnSecureDesktop', type: REG_DWORD, data: '1', option: 'enable-uac'}
  - !writeStatus: {status: 'Configuring UAC', option: 'disable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'EnableLUA', type: REG_DWORD, data: '0', option: 'disable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin', type: REG_DWORD, data: '0', option: 'disable-uac'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'PromptOnSecureDesktop', type: REG_DWORD, data: '0', option: 'disable-uac'}

  # ===========================================================================
  #  TELEMETRY / PRIVACY
  # ===========================================================================
  - !writeStatus: {status: 'Reducing Telemetry'}
  - !service: {name: 'DiagTrack', operation: change, startup: 4}
  - !service: {name: 'dmwappushservice', operation: change, startup: 4}
  - !service: {name: 'diagnosticshub.standardcollector.service', operation: change, startup: 4}
  - !service: {name: 'diagsvc', operation: change, startup: 4}
  - !service: {name: 'WerSvc', operation: change, startup: 4}
  - !service: {name: 'PcaSvc', operation: change, startup: 4}
  - !service: {name: 'DPS', operation: change, startup: 4}
  - !service: {name: 'WdiServiceHost', operation: change, startup: 4}
  - !service: {name: 'WdiSystemHost', operation: change, startup: 4}
  - !service: {name: 'RetailDemo', operation: change, startup: 4}
  - !service: {name: 'MapsBroker', operation: change, startup: 4}
  - !service: {name: 'lfsvc', operation: change, startup: 4}
  - !service: {name: 'SharedAccess', operation: change, startup: 4}
  - !service: {name: 'PhoneSvc', operation: change, startup: 4}
  - !service: {name: 'wisvc', operation: change, startup: 4}
  - !service: {name: 'WMPNetworkSvc', operation: change, startup: 4}
  - !service: {name: 'RemoteRegistry', operation: change, startup: 4}
  - !service: {name: 'seclogon', operation: change, startup: 4}
  - !service: {name: 'Fax', operation: change, startup: 4}
  - !service: {name: 'SEMgrSvc', operation: change, startup: 4}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', value: 'AllowTelemetry', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection', value: 'AllowTelemetry', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', value: 'DoNotShowFeedbackNotifications', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', value: 'AllowCommercialDataPipeline', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent', value: 'DisableWindowsConsumerFeatures', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent', value: 'DisableSoftLanding', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SilentInstalledAppsEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-338388Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-338389Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-310093Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SystemPaneSuggestionsEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo', value: 'Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo', value: 'DisabledByGroupPolicy', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location', value: 'Value', type: REG_SZ, data: 'Deny'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location', value: 'Value', type: REG_SZ, data: 'Deny'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors', value: 'DisableLocation', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'AllowCortana', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'AllowCloudSearch', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'AllowSearchToUseLocation', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'DisableWebSearch', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'ConnectedSearchUseWeb', type: REG_DWORD, data: '0'}
  - !writeStatus: {status: 'Disabling CEIP'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\SQMClient\Windows', value: 'CEIPEnable', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\SQMClient\Windows', value: 'CEIPEnable', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Siuf\Rules', value: 'NumberOfSIUFInPeriod', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', value: 'AITEnable', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', value: 'DisableInventory', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', value: 'DisableUAR', type: REG_DWORD, data: '1'}

  # ===========================================================================
  #  GAMING / PERFORMANCE
  # ===========================================================================
  - !writeStatus: {status: 'Optimizing for Gaming'}
  - !registryValue: {path: 'HKCU\System\GameConfigStore', value: 'GameDVR_Enabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\System\GameConfigStore', value: 'GameDVR_FSEBehaviorMode', type: REG_DWORD, data: '2'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR', value: 'AppCaptureEnabled', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR', value: 'AllowGameDVR', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\GameBar', value: 'AutoGameModeEnabled', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\GameBar', value: 'ShowStartupPanel', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', value: 'HwSchMode', type: REG_DWORD, data: '2'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', value: 'DisableOverlays', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\Dwm', value: 'OverlayTestMode', type: REG_DWORD, data: '5'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'SystemResponsiveness', type: REG_DWORD, data: '10'}
