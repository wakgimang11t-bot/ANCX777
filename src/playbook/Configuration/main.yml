  - !service: {name: 'SysMain', operation: change, startup: 4, option: 'disable-sysmain'}
  - !cmd: {command: 'sc stop SysMain', wait: true, errorAction: Ignore, option: 'disable-sysmain'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters', value: 'EnablePrefetcher', type: REG_DWORD, data: '0', option: 'disable-sysmain'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters', value: 'EnableSuperfetch', type: REG_DWORD, data: '0', option: 'disable-sysmain'}
  # Undo path, so re-running with "Keep SysMain" restores prefetching.
  - !writeStatus: {status: 'Restoring SysMain', option: 'keep-sysmain'}
  - !service: {name: 'SysMain', operation: change, startup: 2, option: 'keep-sysmain'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters', value: 'EnablePrefetcher', type: REG_DWORD, data: '3', option: 'keep-sysmain'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters', value: 'EnableSuperfetch', type: REG_DWORD, data: '3', option: 'keep-sysmain'}
  - !cmd: {command: 'sc start SysMain', wait: true, errorAction: Ignore, option: 'keep-sysmain'}

  # ===========================================================================
  #  HIBERNATION / FAST STARTUP
  # ===========================================================================
  - !writeStatus: {status: 'Disabling Hibernation and Fast Startup', option: 'disable-hibernate'}
  - !cmd: {command: 'powercfg /h off', wait: true, errorAction: Ignore, option: 'disable-hibernate'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power', value: 'HiberbootEnabled', type: REG_DWORD, data: '0', option: 'disable-hibernate'}
  # Undo path, so re-running with "Keep Hibernate" turns both back on.
  - !writeStatus: {status: 'Restoring Hibernation and Fast Startup', option: 'keep-hibernate'}
  - !cmd: {command: 'powercfg /h on', wait: true, errorAction: Ignore, option: 'keep-hibernate'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power', value: 'HiberbootEnabled', type: REG_DWORD, data: '1', option: 'keep-hibernate'}

  # ===========================================================================
  #  RESPONSIVENESS TWEAKS
  # ===========================================================================
  - !writeStatus: {status: 'Applying Responsiveness Tweaks'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Serialize', value: 'StartupDelayInMSec', type: REG_DWORD, data: '0', option: 'perf-startup-delay'}
  - !registryValue: {path: 'HKCU\Control Panel\Desktop', value: 'MenuShowDelay', type: REG_SZ, data: '0', option: 'perf-fast-menus'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'TaskbarAnimations', type: REG_DWORD, data: '0', option: 'perf-fast-menus'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'ExtendedUIHoverTime', type: REG_DWORD, data: '1', option: 'perf-fast-menus'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling', value: 'PowerThrottlingOff', type: REG_DWORD, data: '1', option: 'perf-power-throttling'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications', value: 'GlobalUserDisabled', type: REG_DWORD, data: '1', option: 'perf-background-apps'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search', value: 'BackgroundAppGlobalToggle', type: REG_DWORD, data: '0', option: 'perf-background-apps'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy', value: 'LetAppsRunInBackground', type: REG_DWORD, data: '2', option: 'perf-background-apps'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SoftLandingEnabled', type: REG_DWORD, data: '0', option: 'perf-tips-suggestions'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'RotatingLockScreenOverlayEnabled', type: REG_DWORD, data: '0', option: 'perf-tips-suggestions'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-338387Enabled', type: REG_DWORD, data: '0', option: 'perf-tips-suggestions'}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-353698Enabled', type: REG_DWORD, data: '0', option: 'perf-tips-suggestions'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent', value: 'DisableWindowsSpotlightFeatures', type: REG_DWORD, data: '1', option: 'perf-tips-suggestions'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent', value: 'DisableCloudOptimizedContent', type: REG_DWORD, data: '1', option: 'perf-tips-suggestions'}
  - !cmd: {command: 'fsutil behavior set disablelastaccess 1', wait: true, errorAction: Ignore, option: 'perf-last-access'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl', value: 'Win32PrioritySeparation', type: REG_DWORD, data: '38', option: 'perf-cpu-priority'}
  - !registryValue: {path: 'HKCU\Control Panel\Accessibility\StickyKeys', value: 'Flags', type: REG_SZ, data: '506', option: 'perf-accessibility-prompts'}
  - !registryValue: {path: 'HKCU\Control Panel\Accessibility\Keyboard Response', value: 'Flags', type: REG_SZ, data: '122', option: 'perf-accessibility-prompts'}
  - !registryValue: {path: 'HKCU\Control Panel\Accessibility\ToggleKeys', value: 'Flags', type: REG_SZ, data: '58', option: 'perf-accessibility-prompts'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\ReserveManager', value: 'ShippedWithReserves', type: REG_DWORD, data: '0', option: 'perf-reserved-storage'}
  - !cmd: {command: 'DISM /Online /Set-ReservedStorageState /State:Disabled', wait: true, errorAction: Ignore, option: 'perf-reserved-storage'}
  - !powerShell:
      wait: true
      option: 'perf-clean-temp'
      errorAction: Ignore
      command: >-
        foreach ($t in @($env:TEMP, (Join-Path $env:SystemRoot 'Temp'))) { if (Test-Path -LiteralPath $t) { Get-ChildItem -LiteralPath $t -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue } }
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control', value: 'WaitToKillServiceTimeout', type: REG_SZ, data: '2000', option: 'perf-shutdown-hangs'}
  - !registryValue: {path: 'HKCU\Control Panel\Desktop', value: 'HungAppTimeout', type: REG_SZ, data: '1000', option: 'perf-shutdown-hangs'}
  - !registryValue: {path: 'HKCU\Control Panel\Desktop', value: 'WaitToKillAppTimeout', type: REG_SZ, data: '2000', option: 'perf-shutdown-hangs'}
  - !registryValue: {path: 'HKCU\Control Panel\Desktop', value: 'AutoEndTasks', type: REG_SZ, data: '1', option: 'perf-shutdown-hangs'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\Maintenance', value: 'MaintenanceDisabled', type: REG_DWORD, data: '1', option: 'perf-disable-maintenance'}
  - !powerShell:
      wait: true
      option: 'perf-disable-maintenance'
      errorAction: Ignore
      command: >-
        schtasks /change /tn '\Microsoft\Windows\TaskScheduler\Idle Maintenance' /disable 2>$null | Out-Null

  # ===========================================================================
  #  GPU OVERLAYS (NVIDIA Alt+Z / ShadowPlay, Steam, Discord)
  # ===========================================================================
  - !writeStatus: {status: 'Ensuring GPU Overlays Work', option: 'keep-nvidia-overlay'}
  # Never block the graphics overlay plane every in-game overlay hooks into.
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', value: 'DisableOverlays', type: REG_DWORD, data: '0', option: 'keep-nvidia-overlay'}
  # NVIDIA container services must stay available for Alt+Z / instant replay / screenshot.
  - !service: {name: 'NvContainerLocalSystem', operation: change, startup: 2, option: 'keep-nvidia-overlay'}
  - !service: {name: 'NVDisplay.ContainerLocalSystem', operation: change, startup: 2, option: 'keep-nvidia-overlay'}
  - !service: {name: 'NvContainerNetworkService', operation: change, startup: 3, option: 'keep-nvidia-overlay'}
  # Keep the capture / recording stack from being disabled.
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR', value: 'AppCaptureEnabled', type: REG_DWORD, data: '1', option: 'keep-nvidia-overlay'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR', value: 'HistoricalCaptureEnabled', type: REG_DWORD, data: '1', option: 'keep-nvidia-overlay'}

  # ===========================================================================
  #  FINALIZE
  # ===========================================================================
  - !writeStatus: {status: 'Synchronizing System Time'}
  - !cmd: {command: 'w32tm /resync /force', wait: true, errorAction: Ignore}
  - !writeStatus: {status: 'Cleaning Up Leftovers'}
  - !file: {path: '%SystemDrive%\Users\Public\Desktop\Microsoft Edge.lnk'}
  - !file: {path: '%SystemDrive%\Users\Public\Desktop\Microsoft Edge.url'}
  - !file: {path: '%ProgramData%\Microsoft\Windows\Start Menu\Programs\Microsoft Edge.lnk'}
  - !writeStatus: {status: 'Finalizing'}
  - !cmd: {command: 'DISM /Online /Cleanup-Image /StartComponentCleanup /ResetBase', wait: true, errorAction: Ignore}
  - !writeStatus: {status: 'Done. A reboot is recommended.'}
