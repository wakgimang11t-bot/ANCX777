<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>ANCX777</Name>
	<Username>ANCX777</Username>
	<Title>ANCX777 Playbook VCNX.777</Title>
	<ShortDescription>Created by ANCX777</ShortDescription>
	<Description>ANCX777 is a playbook that focuses on improving gaming performance and privacy on Windows 10 and 11.</Description>
	<Details>ANCX777 is a playbook that focuses on improving gaming performance and privacy. It applies power, input, network, and privacy tweaks, removes unwanted apps and Edge, and can disable Defender, printing, and telemetry.</Details>
	<ProgressText>ANCX777 is being applied. This playbook targets a wide range of Windows 10/11 builds, so a few steps may report errors that can be ignored. If your computer does not reboot on its own when everything is done, reboot it manually.</ProgressText>
	<Version>0.777</Version>
	<UpgradableFrom>any</UpgradableFrom>
	<SupportedBuilds>
		<string>17763</string>
		<string>18362</string>
		<string>18363</string>
		<string>19041</string>
		<string>19042</string>
		<string>19043</string>
		<string>19044</string>
		<string>19045</string>
		<string>22000</string>
		<string>22621</string>
		<string>22631</string>
		<string>26100</string>
		<string>26200</string>
		<string>26300</string>
		<string>28000</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
	</Requirements>
	<Overhaul>false</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<UniqueId>0865e762-7c43-403c-b55f-51e2599a2bad</UniqueId>
	<Git>https://github.com/wakgimang11t-bot/ANCX777</Git>
	<Website>https://github.com/wakgimang11t-bot/ANCX777</Website>
	<FeaturePages>
		<RadioPage DefaultOption="disable-defender" Description="Disabling Defender improves performance. Windows Security can be restored later by re-running the playbook with 'Keep Defender'.">
			<Options>
				<RadioOption>
					<Text>Disable Defender (Default)</Text>
					<Name>disable-defender</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Defender</Text>
					<Name>enable-defender</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="enable-uac" Description="Choose User Account Control behavior">
			<Options>
				<RadioOption>
					<Text>Enable UAC (Default)</Text>
					<Name>enable-uac</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable UAC [may break Microsoft login]</Text>
					<Name>disable-uac</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="remove-edge" Description="Choose what to do with Microsoft Edge">
			<Options>
				<RadioOption>
					<Text>Remove Microsoft Edge (Recommended)</Text>
					<Name>remove-edge</Name>
					<Description>Removes the Edge browser. WebView2 can be reinstalled later from Microsoft if an app needs it.</Description>
				</RadioOption>
				<RadioOption>
					<Text>Keep Microsoft Edge</Text>
					<Name>keep-edge</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="change-wallpaper" Description="Choose whether to apply the ANCX777 desktop and lock screen wallpaper. Drop your own image at Executables\Windows\Web\Wallpaper\ANCX777\img0.jpg before packaging.">
			<Options>
				<RadioOption>
					<Text>Apply ANCX777 Wallpaper (Default)</Text>
					<Name>change-wallpaper</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Current Wallpaper</Text>
					<Name>keep-wallpaper</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="add-branding" Description="Adds the ACNX+ Optimize name under 'Windows User' in the About Windows (winver) dialog. Windows prints that line from RegisteredOrganization. Cosmetic only - it does not touch activation.">
			<Options>
				<RadioOption>
					<Text>Add ACNX+ Optimize Branding (Default)</Text>
					<Name>add-branding</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Windows Default</Text>
					<Name>keep-branding</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="disable-printing" Description="Choose what to do with Windows printing services">
			<Options>
				<RadioOption>
					<Text>Disable Printing (Default)</Text>
					<Name>disable-printing</Name>
					<Description>Disables the Print Spooler and related services, scheduled tasks, and printing Windows features.</Description>
				</RadioOption>
				<RadioOption>
					<Text>Keep Printing</Text>
					<Name>keep-printing</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Choose which ANCX777 optimizations to apply:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Cleanup Taskbar and Start Menu</Text>
					<Name>cleanup-taskbar</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft OneDrive</Text>
					<Name>remove-onedrive</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft Teams</Text>
					<Name>remove-teams</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove WSL (Windows Subsystem for Linux)</Text>
					<Name>remove-wsl</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Optional app removals:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Photos App</Text>
					<Name>remove-photos</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Xbox Apps</Text>
					<Name>remove-xbox</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove AI Features (Copilot, Recall)</Text>
					<Name>remove-ai</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioPage DefaultOption="disable-search" Description="Windows Search indexing keeps disks and CPU busy in the background. Disabling it makes the system feel lighter; the Start menu still finds apps and files by name.">
			<Options>
				<RadioOption>
					<Text>Disable Search Indexing (Recommended)</Text>
					<Name>disable-search</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Windows Search</Text>
					<Name>keep-search</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="snappy-visuals" Description="Minimal animations, no transparency and instant menus make the desktop feel noticeably faster.">
			<Options>
				<RadioOption>
					<Text>Snappy Visuals (Recommended)</Text>
					<Name>snappy-visuals</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Visual Effects</Text>
					<Name>keep-visuals</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="disable-sysmain" Description="SysMain (Superfetch) preloads programs into RAM. On an SSD it usually adds disk/CPU activity for little gain.">
			<Options>
				<RadioOption>
					<Text>Disable SysMain (Recommended for SSD)</Text>
					<Name>disable-sysmain</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep SysMain (better on HDD)</Text>
					<Name>keep-sysmain</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="disable-hibernate" Description="Disabling hibernation also turns off Fast Startup, frees several GB on disk and gives a clean cold boot.">
			<Options>
				<RadioOption>
					<Text>Disable Hibernation &amp; Fast Startup (Recommended)</Text>
					<Name>disable-hibernate</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Hibernation</Text>
					<Name>keep-hibernate</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Performance &amp; responsiveness tweaks 1/3 (recommended on):">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Startup Delay</Text>
					<Name>perf-startup-delay</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Instant Menus (Menu Show Delay = 0)</Text>
					<Name>perf-fast-menus</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable Power Throttling</Text>
					<Name>perf-power-throttling</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable Background Apps</Text>
					<Name>perf-background-apps</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Performance &amp; responsiveness tweaks 2/3 (recommended on):">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Disable Tips, Suggestions and Spotlight</Text>
					<Name>perf-tips-suggestions</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable Last Access Timestamp</Text>
					<Name>perf-last-access</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>CPU Priority For Games (Win32PrioritySeparation)</Text>
					<Name>perf-cpu-priority</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable Sticky / Filter / Toggle Keys Prompts</Text>
					<Name>perf-accessibility-prompts</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Performance &amp; responsiveness tweaks 3/3:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Disable Reserved Storage</Text>
					<Name>perf-reserved-storage</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Clean Temp Files</Text>
					<Name>perf-clean-temp</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Faster Shutdown (Less Hangs)</Text>
					<Name>perf-shutdown-hangs</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable Automatic Maintenance</Text>
					<Name>perf-disable-maintenance</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Overlay compatibility - keeps the NVIDIA GeForce/NVIDIA App overlay (Alt+Z), Steam and Discord overlays working for recording and screenshots:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Keep NVIDIA Overlay + Alt+Z (Recommended)</Text>
					<Name>keep-nvidia-overlay</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
</Playbook>
